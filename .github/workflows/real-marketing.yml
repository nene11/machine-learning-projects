name: real-marketing-benchmark

on:
  push:
    paths:
      - '07_marketing_campaign_optimization/**'
      - '.github/workflows/real-marketing.yml'
  pull_request:
    paths:
      - '07_marketing_campaign_optimization/**'
      - '.github/workflows/real-marketing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas scikit-learn

      - name: Train on real UCI data
        run: python 07_marketing_campaign_optimization/src/train.py

      - name: Validate results artifact
        run: |
          test -s 07_marketing_campaign_optimization/results_real.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('07_marketing_campaign_optimization/results_real.json')
          r = json.loads(p.read_text())
          required = ['records', 'cv_roc_auc_mean', 'test_roc_auc', 'test_pr_auc', 'test_f1_optimized']
          missing = [k for k in required if k not in r]
          if missing:
              raise SystemExit(f'Missing metrics: {missing}')
          if r['records'] < 40000:
              raise SystemExit(f'Unexpected record count: {r["records"]}')
          print(json.dumps(r, indent=2))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: marketing-real-results
          path: 07_marketing_campaign_optimization/results_real.json
