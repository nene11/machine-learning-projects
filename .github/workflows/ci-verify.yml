name: portfolio-ci-verify

on:
  push:
    branches: ["ci-verification", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scikit-learn pytest

      - name: Verify project files
        run: |
          test -f 07_marketing_campaign_optimization/src/train.py
          test -f 08_sales_forecasting/src/train.py
          test -f 09_customer_segmentation/src/train.py
          test -f 10_end_to_end_mlops/src/train.py

      - name: Run ML training smoke tests
        run: |
          python 07_marketing_campaign_optimization/src/train.py
          python 08_sales_forecasting/src/train.py
          python 09_customer_segmentation/src/train.py
          python 10_end_to_end_mlops/src/train.py

      - name: Run tests
        run: python -m pytest 07_marketing_campaign_optimization/tests 09_customer_segmentation/tests 10_end_to_end_mlops/tests -q
