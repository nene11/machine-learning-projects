name: portfolio-ci
on: [push, pull_request]
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy pandas scikit-learn pytest
      - run: python 07_marketing_campaign_optimization/src/train.py
      - run: python 08_sales_forecasting/src/train.py
      - run: python 09_customer_segmentation/src/train.py
      - run: python 10_end_to_end_mlops/src/train.py
      - run: python -m pytest 07_marketing_campaign_optimization/tests 09_customer_segmentation/tests 10_end_to_end_mlops/tests